<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar pessoa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f1c0b;
      color: #f3ecd6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #16260f;
      border: 1px solid #d9b23c;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    h1 { margin-top: 0; font-size: 22px; }
    label { display: block; margin-bottom: 8px; }
    input { width: 100%; padding: 10px; border-radius: 10px; border: 0; margin-bottom: 14px; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #d9b23c; color: #241b06; font-weight: bold; cursor: pointer; }
    .msg { margin-top: 12px; font-size: 14px; }
    .msg.ok { color: #7ec98c; }
    .msg.err { color: #e17878; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cadastrar pessoa</h1>
    <form id="form-cadastro">
      <label for="name">Nome</label>
      <input id="name" name="name" required />
      <label for="birth">Data de nascimento</label>
      <input id="birth" name="birth" type="date" required />
      <button type="submit">Salvar cadastro</button>
    </form>
    <div id="message" class="msg"></div>
  </div>

  <script>
    const form = document.getElementById('form-cadastro');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = document.getElementById('name').value.trim();
      const birth = document.getElementById('birth').value;

      if (!name || !birth) {
        message.textContent = 'Preencha todos os campos.';
        message.className = 'msg err';
        return;
      }

      try {
        const response = await fetch('/api/cadastrar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, birthDate: birth })
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erro ao salvar');
        }

        message.textContent = data.message;
        message.className = 'msg ok';
        form.reset();
      } catch (error) {
        message.textContent = error.message;
        message.className = 'msg err';
      }
    });
  </script>
</body>
</html>
